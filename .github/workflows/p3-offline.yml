name: P3 Offline Checks
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "runtimes/Revit-mcp/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/p3-offline.yml"
  pull_request:
  workflow_dispatch:
jobs:
  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Node syntax
        run: |
          for source in src/*.mjs tests/*.test.mjs; do
            node --check "$source"
          done
      - name: P3 contract tests
        run: node --test tests/p3-*.test.mjs tests/m8-mcp-dev-reload.test.mjs
  python-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtimes/Revit-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q connection tools services tests
      - name: P3 offline route tests
        run: python -m unittest discover -s tests -p "test_p3_*.py" -v
  native-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Parse Native doctor and install scripts
        shell: pwsh
        run: |
          $paths = @("scripts/check-revit-bridge-host.ps1", "scripts/p3-test-and-install.ps1")
          foreach ($p in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$p has PowerShell syntax errors: $($errors | Out-String)" }
          }
      - name: Compile Native Revit API adapter against CI-only 2024 references
        shell: pwsh
        run: |
          dotnet build runtimes/Revit-mcp/bridge/unified_native/RevitGPT.Native.csproj --configuration Release -p:UseNugetRevitApi=true --nologo
