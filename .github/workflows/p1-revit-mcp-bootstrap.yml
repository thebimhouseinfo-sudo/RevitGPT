name: P1 Revit MCP Bootstrap

on:
  push:
    branches:
      - work/J-AFC4-p1-revit-mcp-bootstrap
  workflow_dispatch:

jobs:
  bootstrap-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm install

      - name: Check Node syntax
        shell: pwsh
        run: |
          node --check src/index.mjs
          node --check src/revit-upstream.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Revit MCP Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r runtimes/Revit-mcp/requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q runtimes/Revit-mcp

      - name: Run bridge unit tests
        shell: pwsh
        working-directory: runtimes/Revit-mcp
        run: |
          python -m unittest discover -s tests -p "test_bridge.py"
