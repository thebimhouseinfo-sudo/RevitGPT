name: P1 Revit MCP Bootstrap

on:
  push:
    branches:
      - work/J-AFC4-p1-revit-mcp-bootstrap
  workflow_dispatch:

jobs:
  bootstrap-check:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Node dependencies
        run: npm install

      - name: Check Node syntax
        shell: pwsh
        run: |
          ./scripts/check-node-syntax.ps1

      - name: Simulate Windows bootstrap paths with spaces
        shell: pwsh
        run: |
          ./scripts/simulate-windows-bootstrap.ps1

      - name: Verify AppData contract
        shell: pwsh
        run: node scripts/verify-appdata.mjs

      - name: Smoke Slim MCP startup
        shell: pwsh
        run: |
          ./scripts/smoke-slim-mcp.ps1

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          ./scripts/check-powershell-syntax.ps1

      - name: Verify current Secure MCP tunnel client
        if: matrix.node-version == '24'
        shell: pwsh
        run: |
          ./openai-tunnel.ps1 -VerifyClient

      - name: Check tunnel ownership contract
        shell: pwsh
        run: |
          ./scripts/check-tunnel-ownership.ps1

      - name: Test tunnel doctor with configured health port occupied
        if: matrix.node-version == '24'
        shell: pwsh
        run: |
          ./scripts/test-tunnel-doctor-port-isolation.ps1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Revit MCP Python dependencies
        shell: pwsh
        run: |
          python -m pip install -r runtimes/Revit-mcp/requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q runtimes/Revit-mcp

      - name: Run bridge unit tests
        shell: pwsh
        working-directory: runtimes/Revit-mcp
        run: |
          python -m unittest discover -s tests -p "test_bridge.py"
